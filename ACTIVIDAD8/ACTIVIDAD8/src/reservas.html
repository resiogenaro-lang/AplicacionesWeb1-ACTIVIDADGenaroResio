<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./estilos.css">
</head>
<body>
    <!-- Mismo encabezado para mantener el layout unificado -->
    <header class="site-header">
        <div class="logo-container">
            <a href="index.html">
                <img src="./recursos/imagenes/logo.webp" alt="Isologotipo de Retiro Sustentable - Volver al inicio">
            </a>
            <span class="brand-name">Retiro Sustentable</span>
        </div>
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-main">
        <h1>Reservas</h1>
        <h2>Contactanos</h2>
        
        <!-- Formulario con etiquetas asociadas correctamente por 'for' e 'id' -->
        <form action="#" method="POST" class="reservation-form">
            <div class="form-group">
                <label for="nombre">Nombre de la persona que consulta:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="fecha-desde">Fecha desde:</label>
                <input type="date" id="fecha-desde" name="fecha_desde" required>
            </div>

            <div class="form-group">
                <label for="fecha-hasta">Fecha hasta:</label>
                <input type="date" id="fecha-hasta" name="fecha_hasta" required>
            </div>

            <div class="form-group">
                <label for="comentario">Comentario:</label>
                <textarea id="comentario" name="comentario" rows="4"></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar consulta</button>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
